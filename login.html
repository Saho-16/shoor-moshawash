<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دخول / تسجيل - شعور مشوش</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .auth-container {
            max-width: 400px;
            margin: 100px auto;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 30px;
            text-align: center;
        }
        .auth-container input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 40px;
            border: none;
            background: #2d2a3a;
            color: white;
        }
        .auth-container button {
            background: #c084fc;
            padding: 10px 25px;
            border-radius: 40px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .toggle-link {
            color: #c084fc;
            cursor: pointer;
            margin-top: 15px;
            display: inline-block;
        }
        .error {
            color: #ff9a9e;
            margin: 10px 0;
        }
    </style>
</head>
<body>
<div class="rain-bg"></div>
<div class="auth-container">
    <h2 id="form-title">تسجيل الدخول</h2>
    <input type="email" id="email" placeholder="البريد الإلكتروني" required>
    <input type="password" id="password" placeholder="كلمة المرور" required>
    <input type="text" id="username" placeholder="اسم المستخدم (للتسجيل فقط)" style="display:none;">
    <div id="error-msg" class="error"></div>
    <button id="submit-btn">دخول</button>
    <div>
        <span id="toggle-text" class="toggle-link">ليس لديك حساب؟ سجل الآن</span>
    </div>
    <div><a href="index.html" style="color:#c084fc;">← العودة إلى المجلة</a></div>
</div>
<script>
    const SUPABASE_URL = 'https://cnvipflknxrqpdmecxws'; // غيّر إلى رابط مشروعك
    const SUPABASE_ANON_KEY = 'https://cnvipflknxrqpdmecxws.supabase.co/rest/v1/'; // غيّر إلى المفتاح العام
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let isLogin = true;
    const formTitle = document.getElementById('form-title');
    const submitBtn = document.getElementById('submit-btn');
    const usernameField = document.getElementById('username');
    const toggleText = document.getElementById('toggle-text');
    const errorMsg = document.getElementById('error-msg');
    
    toggleText.addEventListener('click', () => {
        isLogin = !isLogin;
        if (isLogin) {
            formTitle.innerText = 'تسجيل الدخول';
            submitBtn.innerText = 'دخول';
            usernameField.style.display = 'none';
            toggleText.innerText = 'ليس لديك حساب؟ سجل الآن';
        } else {
            formTitle.innerText = 'إنشاء حساب جديد';
            submitBtn.innerText = 'تسجيل';
            usernameField.style.display = 'block';
            toggleText.innerText = 'لديك حساب؟ سجل دخول';
        }
        errorMsg.innerText = '';
    });
    
    submitBtn.addEventListener('click', async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        errorMsg.innerText = '';
        
        if (isLogin) {
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) errorMsg.innerText = error.message;
            else window.location.href = 'admin.html'; // بعد الدخول يذهب للوحة
        } else {
            const username = document.getElementById('username').value;
            if (!username) { errorMsg.innerText = 'اسم المستخدم مطلوب'; return; }
            const { data, error } = await supabase.auth.signUp({
                email, password,
                options: { data: { username } }
            });
            if (error) errorMsg.innerText = error.message;
            else window.location.href = 'admin.html';
        }
    });
</script>
</body>
</html>
